# XcodeGen spec for the S1 embedded-JVM spike. Generate + build with ../build-spike.sh.
# Static libs, the jlinked runtime (jre/) and spike.jar come from ../work/spike/ (prepare step in
# build-spike.sh); libs.xcconfig there holds the per-SDK -force_load lines.
name: JvmSpike
options:
  bundleIdPrefix: dev.oneechan
  deploymentTarget:
    iOS: "26.0"
configFiles:
  Debug: ../work/spike/libs.xcconfig
  Release: ../work/spike/libs.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  JvmSpike:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../work/spike/jre
        type: folder
        buildPhase: resources
      - path: ../work/spike/spike.jar
        buildPhase: resources
      # optional jars (HOST=1 ../build-spike.sh puts the extension host fat jar here)
      - path: ../work/spike/extra
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.oneechan.jvmspike
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridging-Header.h
        HEADER_SEARCH_PATHS: $(JVM_INCLUDE_DIRS)
        OTHER_LDFLAGS: $(JVM_LDFLAGS)
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # JNI_OnLoad_<lib>/JIMAGE_* are found with dlsym(RTLD_DEFAULT) at runtime: keep them exported.
        DEAD_CODE_STRIPPING: NO
        # Link everything into the main executable (as a Release build would), not a debug dylib.
        ENABLE_DEBUG_DYLIB: NO
        STRIP_INSTALLED_PRODUCT: NO
