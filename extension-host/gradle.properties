# Gradle's own defaults, plus a headless AWT: on macOS a GUI "java" app asks for privacy access
# (Input Monitoring, Screen Recording) although nothing here draws on screen.
org.gradle.jvmargs=-Xms256m -Xmx512m -XX:MaxMetaspaceSize=384m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Djava.awt.headless=true
